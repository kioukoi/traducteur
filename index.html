<!doctype html>
<html lang="th" translate="no">
<head>
<meta charset="utf-8">
<meta name="google" content="notranslate">
<meta http-equiv="Content-Language" content="th">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="แปลภาษา">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>แปลภาษา · Traduire</title>
<style>
:root{--bg:#FAF9F5;--card:#fff;--line:#E3E0D5;--ink:#141413;--muted:#5F5E5A;--accent:#0F6E56;--tint:#E1F5EE;--tint-line:#9FE1CB;--tint-ink:#04342C;--chip:#F1EFE8;--err:#A32D2D}
@media (prefers-color-scheme:dark){:root{--bg:#1c1c1a;--card:#262624;--line:#3a3a37;--ink:#f1efe8;--muted:#b4b2a9;--accent:#3fb893;--tint:#12372d;--tint-line:#1d5a49;--tint-ink:#d6f3e8;--chip:#33332f;--err:#f09595}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,"Sarabun","Noto Sans Thai","Helvetica Neue",sans-serif;-webkit-text-size-adjust:100%}
body{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;padding:env(safe-area-inset-top) 18px calc(env(safe-area-inset-bottom) + 12px)}
header{display:flex;align-items:center;justify-content:space-between;padding:14px 0 10px}
h1{font-size:22px;margin:0;font-weight:600}
button{font:inherit;color:inherit;cursor:pointer}
.icon-btn{width:44px;height:44px;border-radius:22px;border:1px solid var(--line);background:var(--card);display:flex;align-items:center;justify-content:center;padding:0}
svg{display:block}
main{flex:1;display:flex;flex-direction:column;gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px 16px 12px;display:flex;flex-direction:column;gap:10px}
.card.out{background:var(--tint);border-color:var(--tint-line);color:var(--tint-ink)}
.label{font-size:12px;font-weight:600;letter-spacing:.04em;color:var(--muted)}
.card.out .label{color:var(--tint-ink);opacity:.8}
textarea{width:100%;min-height:110px;resize:none;border:0;outline:0;background:transparent;color:var(--ink);font:inherit;font-size:19px;line-height:1.5;padding:0}
textarea::placeholder{color:var(--muted)}
.result{font-size:21px;line-height:1.6;white-space:pre-wrap;word-break:break-word}
.note{font-size:15px;line-height:1.6;white-space:pre-wrap;border-top:1px dashed var(--tint-line);padding-top:10px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.pill{min-height:44px;padding:0 16px;border-radius:22px;border:1px solid var(--line);background:var(--card);font-size:15px;display:inline-flex;align-items:center;gap:8px}
.card.out .pill{background:var(--card);border-color:transparent;color:var(--tint-ink)}
.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.tile{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;min-height:150px;padding:16px 10px;border-radius:22px;border:1px solid var(--line);background:var(--card);font-size:19px;font-weight:600;text-align:center;line-height:1.3}
.tile.main{background:var(--accent);border-color:var(--accent);color:#fff;min-height:190px}
.tile .t{display:block}
.tile.listening{background:var(--err);border-color:var(--err);color:#fff;animation:pulse 1.2s infinite}
@keyframes pulse{50%{transform:scale(1.03)}}
.link{background:none;border:0;color:var(--muted);font-size:16px;min-height:48px;text-decoration:underline;width:100%;margin-top:6px}
.back{min-height:44px;padding:0 4px;background:none;border:0;font-size:17px;font-weight:600;color:var(--accent);display:flex;align-items:center;gap:6px;margin-bottom:6px}
.status{font-size:15px;color:var(--muted);display:flex;align-items:center;gap:10px;padding:4px 2px}
.spin{width:18px;height:18px;border-radius:50%;border:2.5px solid var(--line);border-top-color:var(--accent);animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.error{background:rgba(226,75,74,.1);border:1px solid var(--err);color:var(--err);border-radius:14px;padding:12px 14px;font-size:15px;line-height:1.5}
.todo{display:flex;gap:12px;align-items:flex-start;padding:4px 0}
.todo .dot{width:22px;height:22px;border-radius:11px;border:1.5px solid var(--accent);flex:none;margin-top:4px}
.todo .fr{font-size:13px;color:var(--muted);line-height:1.4}
.todo .th{font-size:17px;line-height:1.5}
.thumb{width:100%;max-height:180px;object-fit:cover;border-radius:12px;border:1px solid var(--line)}
details summary{cursor:pointer;min-height:44px;display:flex;align-items:center;font-size:15px;font-weight:600}
dialog{border:0;border-radius:20px;padding:20px;width:min(92vw,420px);background:var(--card);color:var(--ink)}
dialog::backdrop{background:rgba(0,0,0,.45)}
dialog h2{margin:0 0 12px;font-size:19px}
dialog label{display:block;font-size:14px;margin:14px 0 6px;font-weight:600}
dialog input,dialog select{width:100%;min-height:44px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;font-size:16px;padding:0 12px}
.hint{font-size:13px;color:var(--muted);line-height:1.5;margin-top:6px}
[hidden]{display:none!important}
</style>
</head>
<body>
<header>
  <h1>แปลภาษา</h1>
  <button class="icon-btn" id="btnSettings" aria-label="ตั้งค่า / Réglages">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
  </button>
</header>

<main>
  <section id="home">
    <div class="tiles">
      <button class="tile main" id="btnCam"><svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg><span class="t">ถ่ายรูปเอกสาร</span></button>
      <button class="tile main" id="btnPaste"><svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="6" y="5" width="12" height="16" rx="2"/><path d="M9 5V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v1"/><path d="M9 12h6M9 16h4"/></svg><span class="t">วางข้อความ</span></button>
      <button class="tile" id="btnMicTh"><svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="3" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0"/><path d="M12 18v3"/></svg><span class="t">ฉันพูดไทย</span></button>
      <button class="tile" id="btnMicFr"><svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 14v-2a8 8 0 0 1 16 0v2"/><rect x="3" y="14" width="4" height="6" rx="1.5"/><rect x="17" y="14" width="4" height="6" rx="1.5"/></svg><span class="t">ฟังคนพูดฝรั่งเศส</span></button>
    </div>
    <button class="link" id="btnType">พิมพ์ข้อความเอง</button>
    <section class="card" id="inCard" hidden>
      <textarea id="input" placeholder="พิมพ์ภาษาไทยหรือฝรั่งเศส · Thaï ou français" enterkeyhint="done"></textarea>
      <div class="row" style="justify-content:flex-end">
        <button class="pill primary" id="btnTranslate">แปล</button>
      </div>
    </section>
  </section>

  <section id="resultView" hidden>
    <button class="back" id="btnBack"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 5-7 7 7 7"/></svg>กลับ</button>
    <div id="slot" style="display:flex;flex-direction:column;gap:14px"></div>
  </section>
</main>

<input type="file" id="file" accept="image/*" hidden>

<dialog id="dlg">
  <h2>ตั้งค่า · Réglages</h2>
  <label for="key">Clé API Anthropic</label>
  <input id="key" type="password" placeholder="sk-ant-..." autocomplete="off" autocapitalize="off" spellcheck="false">
  <div class="hint">รหัสนี้เก็บไว้ในโทรศัพท์เครื่องนี้เท่านั้น · Elle reste uniquement sur ce téléphone.</div>
  <label for="model">Modèle</label>
  <select id="model">
    <option value="claude-sonnet-5-5">Sonnet 5.5 — แม่นยำที่สุด · le plus précis</option>
    <option value="claude-haiku-5-5">Haiku 5.5 — เร็วและถูกกว่า · plus rapide, moins cher</option>
  </select>
  <div class="row" style="margin-top:18px;justify-content:flex-end">
    <button class="pill" id="btnCancel">ปิด</button>
    <button class="pill primary" id="btnSave">บันทึก</button>
  </div>
</dialog>

<script>
(function(){
"use strict";
var $ = function(id){return document.getElementById(id)};
var store = {
  get:function(k,d){try{var v=localStorage.getItem(k);return v==null?d:v}catch(e){return d}},
  set:function(k,v){try{localStorage.setItem(k,v)}catch(e){}}
};
var state = {busy:false, recog:null, lastText:"", lastMode:"", lastImage:null};

var SYSTEM_TEXT =
"You are a professional French-Thai translator. The user is a Thai woman living in France.\n" +
"Detect the language of the input.\n" +
"- If it is French (or any language other than Thai), translate it into natural, clear Thai, keeping the register of the source (polite stays polite, casual stays casual). Do not add polite particles such as ค่ะ or ครับ unless the source is direct speech that calls for them.\n" +
"- If it is Thai, translate it into natural French. Use vouvoiement and a polite register by default, since the text is usually meant for administrations, doctors, shops or neighbours.\n" +
"Keep names, numbers, dates, addresses, amounts and line breaks exactly. Do not summarise or omit anything.\n" +
"Output format: first line is exactly one of [FR>TH] or [TH>FR]. Then a blank line, then only the translation, with no quotes and no comments.\n" +
"If the user asks for an explanation, add after the translation a line containing only ###NOTE### and then a short explanation in Thai (3 sentences at most) of any idiom, administrative term or cultural point the Thai reader might not understand. Otherwise never add notes.";

var SYSTEM_PHOTO =
"You help a Thai woman living in France understand French documents (letters, forms, bills, notices, screenshots of messages or social media posts).\n" +
"Read the image carefully, including small print. Reply with JSON only, no markdown fence, in this exact shape:\n" +
'{"lang":"fr","summary":"...","todo":[{"th":"...","fr":"..."}],"full":"..."}\n' +
"- summary: 2 to 4 short sentences in simple Thai saying who wrote it, what it is about and what matters most (dates, amounts, deadlines).\n" +
"- todo: the concrete actions or documents required, each in simple Thai with the original French wording in the fr field. Empty array if there is nothing to do.\n" +
"- full: a faithful, complete translation of the readable text into Thai, keeping line breaks.\n" +
"If the text in the image is Thai, write summary, todo.th and full in French instead and set lang to th.\n" +
"If the image is unreadable, set summary to a short Thai sentence asking for a clearer photo and leave the other fields empty.";

function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}

function showView(v){
  $("home").hidden = v!=="home";
  $("resultView").hidden = v!=="result";
  window.scrollTo(0,0);
}
function goHome(){
  if(state.recog){ try{state.recog.stop()}catch(e){} }
  window.speechSynthesis && window.speechSynthesis.cancel();
  $("slot").innerHTML = ""; $("input").value = ""; $("inCard").hidden = true;
  state.busy = false;
  showView("home");
}
function setBusy(on, msg){
  state.busy = on;
  var slot = $("slot");
  if(on){
    showView("result");
    slot.innerHTML = '<div class="status"><div class="spin"></div><span>'+esc(msg||"กำลังแปล…")+'</span></div>';
  }
}
function showError(msg){
  showView("result");
  $("slot").innerHTML = '<div class="error">'+esc(msg)+'</div>';
}

function callClaude(system, content, maxTokens){
  var key = store.get("apiKey","");
  if(!key){ openSettings(); return Promise.reject(new Error("NOKEY")); }
  return fetch("https://api.anthropic.com/v1/messages",{
    method:"POST",
    headers:{
      "content-type":"application/json",
      "x-api-key":key,
      "anthropic-version":"2023-06-01",
      "anthropic-dangerous-direct-browser-access":"true"
    },
    body:JSON.stringify({
      model:store.get("model","claude-sonnet-5-5"),
      max_tokens:maxTokens,
      system:system,
      messages:[{role:"user",content:content}]
    })
  }).then(function(r){
    return r.json().then(function(j){
      if(!r.ok){
        var m = (j && j.error && j.error.message) || ("HTTP "+r.status);
        var e = new Error(m); e.status = r.status; throw e;
      }
      var t = (j.content||[]).filter(function(b){return b.type==="text"}).map(function(b){return b.text}).join("");
      return t;
    });
  });
}

function explainError(e){
  if(e && e.message==="NOKEY") return null;
  if(e && e.status===401) return "รหัส API ไม่ถูกต้อง กรุณาตรวจสอบในการตั้งค่า\nClé API invalide : vérifiez les réglages.";
  if(e && e.status===400 && /credit|balance/i.test(e.message)) return "เครดิตหมดแล้ว กรุณาเติมเครดิตที่ console.anthropic.com\nCrédit épuisé : à recharger sur console.anthropic.com.";
  if(e && e.status===429) return "ใช้งานบ่อยเกินไป กรุณารอสักครู่แล้วลองใหม่\nTrop de requêtes : réessayez dans un instant.";
  if(e && e.status>=500) return "เซิร์ฟเวอร์ไม่ว่าง ลองใหม่อีกครั้ง\nService indisponible : réessayez.";
  if(e instanceof TypeError) return "เชื่อมต่ออินเทอร์เน็ตไม่ได้\nPas de connexion internet.";
  return "เกิดข้อผิดพลาด · Erreur : "+((e&&e.message)||e);
}

/* ---------- Texte ---------- */
function translateText(text, variant){
  text = (text||"").trim();
  if(!text || state.busy) return;
  state.lastText = text; state.lastMode = "text";
  setBusy(true,"กำลังแปล…");
  var extra = "";
  if(variant==="polite") extra = "\n\n(Make the translation more polite and formal.)";
  if(variant==="simple") extra = "\n\n(Use simpler words and shorter sentences.)";
  if(variant==="explain") extra = "\n\n(Please add the explanation after ###NOTE###.)";
  var thaiChars = (text.match(/[\u0E00-\u0E7F]/g)||[]).length;
  if(!variant && text.length>280 && thaiChars/text.length<0.3){
    extra += "\n\n(After ###NOTE### add a gist in Thai, 2 sentences at most: what this text is about and what, if anything, the reader should do.)";
  }
  callClaude(SYSTEM_TEXT, text+extra, 2000).then(function(out){
    setBusy(false);
    renderText(out);
  }).catch(function(e){
    setBusy(false);
    var m = explainError(e); if(m) showError(m);
  });
}

function renderText(out){
  var dir = "FR>TH";
  var m = out.match(/^\s*\[(FR>TH|TH>FR)\]\s*/);
  if(m){ dir = m[1]; out = out.slice(m[0].length); }
  var parts = out.split(/\n?###NOTE###\n?/);
  var main = parts[0].trim();
  var note = (parts[1]||"").trim();
  var toThai = dir==="FR>TH";
  var label = toThai ? "คำแปลภาษาไทย" : "คำแปลภาษาฝรั่งเศส · FRANÇAIS";
  var html = '<section class="card out" id="outCard" lang="'+(toThai?"th":"fr")+'">'+
    '<div class="label">'+label+'</div>'+
    '<div class="result" id="resText">'+esc(main)+'</div>'+
    (note?'<div class="note" lang="th">'+esc(note)+'</div>':'')+
    '<div class="row">'+
      '<button class="pill" id="btnListen">ฟัง</button>'+
      '<button class="pill" id="btnCopy">คัดลอก</button>'+
    '</div>'+
    '<details><summary>เพิ่มเติม</summary><div class="row">'+
      '<button class="pill" data-v="polite">สุภาพขึ้น</button>'+
      '<button class="pill" data-v="simple">ง่ายขึ้น</button>'+
      '<button class="pill" data-v="explain">อธิบาย</button>'+
    '</div></details></section>';
  $("slot").innerHTML = html;
  var lang = toThai ? "th-TH" : "fr-FR";
  $("btnListen").onclick = function(){ speak(main, lang); };
  $("btnCopy").onclick = function(){ copy(main, $("btnCopy")); };
  Array.prototype.forEach.call(document.querySelectorAll("[data-v]"), function(b){
    b.onclick = function(){ translateText(state.lastText, b.getAttribute("data-v")); };
  });
}

function speak(text, lang){
  if(!("speechSynthesis" in window)) return;
  window.speechSynthesis.cancel();
  var u = new SpeechSynthesisUtterance(text);
  u.lang = lang;
  var voices = window.speechSynthesis.getVoices();
  for(var i=0;i<voices.length;i++){ if(voices[i].lang && voices[i].lang.replace("_","-").indexOf(lang)===0){ u.voice = voices[i]; break; } }
  window.speechSynthesis.speak(u);
}

function copy(text, btn){
  var done = function(){ var o=btn.textContent; btn.textContent="คัดลอกแล้ว ✓"; setTimeout(function(){btn.textContent=o},1500); };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(done,function(){});
  } else {
    var t=document.createElement("textarea"); t.value=text; document.body.appendChild(t); t.select();
    try{document.execCommand("copy"); done();}catch(e){} document.body.removeChild(t);
  }
}

/* ---------- Voix ---------- */
function listen(lang, btn){
  var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SR){ showError("เบราว์เซอร์นี้ไม่รองรับการพูด ใช้การพิมพ์แทน\nLa dictée n'est pas disponible ici : utilisez le clavier."); return; }
  if(state.recog){ try{state.recog.stop()}catch(e){} return; }
  var r = new SR();
  r.lang = lang; r.interimResults = true; r.continuous = false;
  var finalText = "";
  var lab = btn.querySelector(".t"), oldLab = lab.textContent;
  lab.textContent = "กำลังฟัง… แตะเพื่อหยุด";
  btn.classList.add("listening");
  r.onresult = function(ev){
    var t = "";
    for(var i=0;i<ev.results.length;i++){ t += ev.results[i][0].transcript; }
    finalText = t; $("input").value = t;
  };
  r.onerror = function(ev){
    if(ev.error==="not-allowed" || ev.error==="service-not-allowed"){
      showError("กรุณาอนุญาตให้ใช้ไมโครโฟน (ตั้งค่า iPhone > Safari > ไมโครโฟน)\nAutorisez le micro dans les réglages de l'iPhone.");
    }
  };
  r.onend = function(){
    btn.classList.remove("listening"); lab.textContent = oldLab; state.recog = null;
    if(finalText.trim()) translateText(finalText);
  };
  state.recog = r;
  try{ r.start(); }catch(e){ btn.classList.remove("listening"); lab.textContent = oldLab; state.recog=null; }
}

/* ---------- Photo ---------- */
function resizeImage(file){
  return new Promise(function(resolve,reject){
    var url = URL.createObjectURL(file);
    var img = new Image();
    img.onload = function(){
      var max = 1568, w = img.naturalWidth, h = img.naturalHeight;
      var s = Math.min(1, max/Math.max(w,h));
      var c = document.createElement("canvas");
      c.width = Math.round(w*s); c.height = Math.round(h*s);
      c.getContext("2d").drawImage(img,0,0,c.width,c.height);
      URL.revokeObjectURL(url);
      var data = c.toDataURL("image/jpeg",0.88);
      resolve({data:data.split(",")[1], url:data});
    };
    img.onerror = function(){ URL.revokeObjectURL(url); reject(new Error("image")); };
    img.src = url;
  });
}

function translatePhoto(file){
  if(state.busy) return;
  state.lastMode = "photo";
  setBusy(true,"กำลังอ่านรูป…");
  resizeImage(file).then(function(img){
    state.lastImage = img;
    var content = [
      {type:"image",source:{type:"base64",media_type:"image/jpeg",data:img.data}},
      {type:"text",text:"Analyse this document."}
    ];
    return callClaude(SYSTEM_PHOTO, content, 4000).then(function(out){
      setBusy(false); renderPhoto(out, img.url);
    });
  }).catch(function(e){
    setBusy(false);
    var m = (e && e.message==="image") ? "เปิดรูปไม่ได้ ลองถ่ายใหม่\nImpossible de lire la photo." : explainError(e);
    if(m) showError(m);
  });
}

function parseJson(out){
  var a = out.indexOf("{"), b = out.lastIndexOf("}");
  if(a<0||b<=a) return null;
  try{ return JSON.parse(out.slice(a,b+1)); }catch(e){ return null; }
}

function renderPhoto(out, thumb){
  var j = parseJson(out);
  if(!j){
    $("slot").innerHTML = '<section class="card out"><div class="label">ผลการแปล</div><div class="result">'+esc(out)+'</div></section>';
    return;
  }
  var isTh = j.lang==="th";
  var html = '<img class="thumb" src="'+thumb+'" alt="">';
  html += '<section class="card out"><div class="label">'+(isTh?'RÉSUMÉ':'สรุปสั้นๆ')+'</div>'+
          '<div class="result" id="sum" style="font-size:20px">'+esc(j.summary||"")+'</div>'+
          '<div class="row"><button class="pill" id="btnListenSum">'+'ฟัง'+'</button></div></section>';
  var todo = j.todo||[];
  if(todo.length){
    html += '<section class="card"><div class="label">'+(isTh?'À FAIRE':'สิ่งที่ต้องทำ')+'</div>';
    todo.forEach(function(t){
      html += '<div class="todo"><div class="dot"></div><div><div class="th">'+esc(t.th||"")+'</div>'+(t.fr?'<div class="fr">'+esc(t.fr)+'</div>':'')+'</div></div>';
    });
    html += '</section>';
  }
  if(j.full){
    html += '<section class="card"><details><summary>'+(isTh?'Traduction complète':'ข้อความแปลทั้งหมด')+'</summary>'+
            '<div class="result" id="full" style="font-size:18px;margin-top:6px">'+esc(j.full)+'</div>'+
            '<div class="row" style="margin-top:8px"><button class="pill" id="btnCopyFull">คัดลอก</button></div></details></section>';
  }
  $("slot").innerHTML = html;
  var lang = isTh ? "fr-FR" : "th-TH";
  var b = $("btnListenSum"); if(b) b.onclick = function(){ speak(j.summary||"", lang); };
  var c = $("btnCopyFull"); if(c) c.onclick = function(){ copy(j.full, c); };
}

/* ---------- Réglages ---------- */
function openSettings(){
  $("key").value = store.get("apiKey","");
  $("model").value = store.get("model","claude-sonnet-5-5");
  var d = $("dlg"); if(d.showModal) d.showModal(); else d.setAttribute("open","");
}

$("btnSettings").onclick = openSettings;
$("btnCancel").onclick = function(){ $("dlg").close(); };
$("btnSave").onclick = function(){
  var k = $("key").value.trim();
  if(k && k.indexOf("sk-ant-")!==0){ $("key").style.borderColor="var(--err)"; return; }
  $("key").style.borderColor="";
  store.set("apiKey", k); store.set("model", $("model").value);
  $("dlg").close();
};

$("btnTranslate").onclick = function(){ $("input").blur(); translateText($("input").value); };
$("btnType").onclick = function(){ $("inCard").hidden = false; $("btnType").hidden = true; $("input").focus(); };
$("btnBack").onclick = goHome;
$("btnPaste").onclick = function(){
  var fallback = function(){ $("inCard").hidden = false; $("btnType").hidden = true; $("input").focus(); };
  if(navigator.clipboard && navigator.clipboard.readText){
    navigator.clipboard.readText().then(function(t){
      if(t && t.trim()){ $("input").value = t; translateText(t); } else { fallback(); }
    }).catch(fallback);
  } else { fallback(); }
};
$("btnMicTh").onclick = function(){ listen("th-TH", $("btnMicTh")); };
$("btnMicFr").onclick = function(){ listen("fr-FR", $("btnMicFr")); };
$("btnCam").onclick = function(){ $("file").value=""; $("file").click(); };
$("file").onchange = function(){ var f=$("file").files[0]; if(f) translatePhoto(f); };

if("serviceWorker" in navigator){ navigator.serviceWorker.register("sw.js").catch(function(){}); }
if(!store.get("apiKey","")){ setTimeout(openSettings, 400); }
})();
</script>
